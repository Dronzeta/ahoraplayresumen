name: Actualizar Dashboard

on:
  schedule:
    - cron: '0 11 * * *'   # 8:00 AM Argentina (UTC-3) = 11:00 UTC
  workflow_dispatch:         # también permite ejecutarlo manualmente desde GitHub

jobs:
  update-dashboard:
    runs-on: ubuntu-latest

    permissions:
      contents: write        # necesario para hacer commit automático

    steps:
      - name: Checkout del repo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar script de fetch
        env:
          METRICOOL_TOKEN: ${{ secrets.METRICOOL_TOKEN }}
        run: python fetch_dashboard.py

      - name: Commit y push del dashboard actualizado
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || git commit -m "Dashboard actualizado $(date +'%d/%m/%Y %H:%M')"
          git push
